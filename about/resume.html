  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --bg: #0a0e17;
      --card: #ffffff;
      --ink: #1f2937;
      --mut: #6b7280;
      --rule: #e5e7eb;
      --indigo: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(800px 400px at 15% -10%, rgba(139,92,246,.18), transparent 60%),
        radial-gradient(700px 380px at 90% 0%, rgba(99,102,241,.16), transparent 60%),
        var(--bg);
      color: var(--ink);
    }
    .toolbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem;
      padding: .8rem 1.25rem;
      background: rgba(10,14,23,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .toolbar a, .toolbar .brand {
      color: #e5e7eb; text-decoration: none; font-size: .9rem; font-weight: 600;
    }
    .toolbar a:hover { color: #a5b4fc; }
    .brand i { color: var(--primary); margin-right: .4rem; }
    .actions { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .btn-gen {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .55rem 1rem; border-radius: .6rem; border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
      font-weight: 600; font-size: .85rem; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn-gen:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,.35); }
    .btn-gen:disabled { opacity: .6; cursor: progress; transform: none; box-shadow: none; }
    .btn-ghost {
      background: transparent; border-color: rgba(255,255,255,.18); color: #e5e7eb;
    }
    .btn-ghost:hover { box-shadow: 0 8px 20px rgba(255,255,255,.06); }
    .toolbar-note { font-size: .72rem; color: #94a3b8; }

    main { padding: 2rem 1rem 3rem; }
    .resume-doc {
      max-width: 850px; margin: 0 auto;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
      padding: clamp(1.5rem, 4vw, 3rem);
      color: var(--ink);
      line-height: 1.45;
      font-size: .95rem;
    }
    .r-name { font-family: 'Poppins', sans-serif; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; letter-spacing: .2px; margin: 0; }
    .r-role { margin: .15rem 0 .5rem; color: var(--indigo); font-weight: 600; font-size: .98rem; }
    .r-contacts { display: flex; flex-wrap: wrap; gap: .25rem .9rem; color: var(--mut); font-size: .82rem; }
    .r-contacts a { color: var(--indigo); text-decoration: none; }
    .r-contacts a:hover { text-decoration: underline; }
    .r-contacts .sep { color: #c7cbd1; }

    .r-section { margin-top: 1.4rem; border-bottom: 1.5px solid var(--rule); padding-bottom: .25rem; }
    .r-section h3 {
      font-family: 'Poppins', sans-serif; font-size: .95rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .7px; color: #111827; margin: 0;
    }
    .r-p { margin: .55rem 0; color: #374151; }

    .r-entry { margin: .55rem 0; }
    .r-row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .r-t { font-weight: 700; color: #111827; }
    .r-t a { color: var(--indigo); text-decoration: none; }
    .r-t a:hover { text-decoration: underline; }
    .r-d, .r-tech { font-style: italic; color: var(--mut); font-size: .88rem; white-space: nowrap; }
    .r-sub { font-style: italic; margin-top: 1px; }
    .r-sub a { color: var(--indigo); text-decoration: none; }
    .r-dtl { font-style: normal; }

    .r-doc ul { margin: .35rem 0 .35rem 1.1rem; padding-left: 0; }
    .r-doc li { margin: .18rem 0; color: #374151; list-style: disc; }
    .r-doc li a { color: var(--indigo); text-decoration: none; }
    .r-doc li a:hover { text-decoration: underline; }

    .r-table { width: 100%; border-collapse: collapse; margin: .4rem 0; }
    .r-table td, .r-table th { padding: .3rem .5rem .3rem 0; font-size: .9rem; color: #374151; text-align: left; }
    .r-table th { color: #111827; }

    .loading { color: var(--mut); display: inline-flex; align-items: center; gap: .5rem; }

    @media (max-width: 640px) {
      .resume-doc { padding: 1.2rem; }
    }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      main { padding: 0; }
      .resume-doc { box-shadow: none; border-radius: 0; max-width: none; padding: 0; }
    }
